[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "minimax-sdd-context"
version = "0.1.0"
description = "Reproducible specification-driven coding context with MiniMax, seekdb and PowerContext"
requires-python = ">=3.12"
dependencies = [
  "powercontext[builtin]==1.2.0",
  "httpx==0.28.1",
  "aiomysql==0.3.2",
  "PyMySQL==1.2.0",
  "sqlalchemy==2.0.54",
  "pyobvector==0.2.28",
  "pydantic==2.13.5",
  "pydantic-ai-slim[anthropic,openai]==2.29.0",
  "pydantic-settings==2.15.0",
  "openai==2.46.0",
  "anthropic==0.117.0",
]

[project.optional-dependencies]
seekdb = ["pylibseekdb==1.4.0.post1; sys_platform == 'linux' or sys_platform == 'darwin'"]
test = ["pytest==9.0.2", "pytest-asyncio==1.4.0"]

[project.scripts]
mini-sdd = "minimax_sdd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_sdd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

