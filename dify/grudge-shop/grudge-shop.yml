            "code_language": "python3",
            "code": "import json\ndef main(body: str, status: int, reply: str) -> dict:\n    if status != 200:\n        raise ValueError(\"本轮记忆未保存，未返回成功回复。请检查服务运行状态。\")\n    result = json.loads(body)\n    if not result.get(\"records\"):\n        raise ValueError(\"记忆服务未返回写入凭据\")\n    return {\"answer\": reply}\n",
            "variables": [
