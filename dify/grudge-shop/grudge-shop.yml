    "name": "记仇杂货铺 · 乌老板的小本本",
    "description": "用奇物制造麻烦，用诚意修补关系。PowerContext让乌老板在新会话也记住你。",
    "mode": "advanced-chat",
    "icon": "🐦",
    "icon_background": "#FDE6D8",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "conversation_variables": [],
