      {
        "id": "gateway-url",
        "name": "GATEWAY_URL",
        "value": "https://configure-your-gateway.example.invalid",
        "value_type": "string",
        "description": "配套网关的可达地址，不带末尾斜杠",
        "selector": [
          "env",
          "GATEWAY_URL"
        ]
      },
      {
        "id": "gateway-token",
        "name": "GATEWAY_TOKEN",
        "value": "REPLACE_WITH_GATEWAY_TOKEN",
        "value_type": "secret",
        "description": "与网关环境变量一致",
        "selector": [
          "env",
          "GATEWAY_TOKEN"
        ]
      }
    ],
    "features": {
      "opening_statement": "欢迎来到记仇杂货铺！我是乌老板。借口罐头、后悔怀表、诚实雨伞，你想先试哪件？本店会记录游戏互动，用于下次光临时认出你。请只输入虚构游戏内容。",
      "suggested_questions": [
        "试试后悔怀表，我想把刚才的砍价撤回",
        "偷偷把借口罐头换成空气",
        "认真道歉，并帮你整理货架"
      ],
      "suggested_questions_after_answer": {
        "enabled": false
      },
      "text_to_speech": {
        "enabled": false,
        "language": "",
        "voice": ""
      },
      "speech_to_text": {
        "enabled": false
      },
      "retriever_resource": {
        "enabled": false
      },
      "sensitive_word_avoidance": {
        "enabled": false
      },
      "file_upload": {
        "enabled": false
      }
    },
