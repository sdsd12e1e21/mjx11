services:
  seekdb:
    image: oceanbase/seekdb:1.3.0.0-100000092026051510
    ports:
      - "127.0.0.1:2881:2881"
    volumes:
      - seekdb-data:/var/lib/oceanbase
    environment:
      ROOT_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -e 'SELECT 1' || obclient -h127.0.0.1 -P2881 -uroot -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 30s
volumes:
  seekdb-data:
